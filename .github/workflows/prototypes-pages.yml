name: Прототипы на GitHub Pages

on:
  push:
    branches:
      - main
      - claude/first-experience-priority-widgets-ehaz2p
    paths:
      - 'prototypes/**'
      - '.github/workflows/prototypes-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/fluid-app/package-lock.json

      - name: Собрать компонентную версию
        working-directory: prototypes/fluid-app
        run: |
          npm ci
          npm run build

      - name: Собрать сайт
        run: |
          mkdir -p site/app site/chat
          cp -r prototypes/fluid-app/dist/. site/app/
          cp prototypes/first-experience/index.html site/chat/index.html
          cp prototypes/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Деплой идёт только с main: окружение github-pages не пускает публикацию
  # с других веток, а её падение висело бы красным чеком на пул-реквесте.
  # На ветке достаточно убедиться, что прототип собирается.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
